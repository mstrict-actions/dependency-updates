name: Supplemental dependency updates
description:
  Validate or update synchronized runtime pins and Ansible Galaxy collections.
author: mstrict-actions
inputs:
  operation:
    description: check or update.
    required: true
  config:
    description: Path to updater configuration JSON.
    required: true
  github-token:
    description:
      Token for update mode; needs contents and actions write permissions.
    required: false
runs:
  using: node24
  main: dist/index.js
